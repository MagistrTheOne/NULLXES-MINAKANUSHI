[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nullxes-minakanushi"
version = "0.1.0"
description = "NULLXES MINAKANUSHI — adaptive situational intelligence for autonomous physical systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "NULLXES Research License" }
authors = [{ name = "NULLXES" }]
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "torch>=2.3",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = [".", "models/MINA-V2-MM/src"]
include = ["minakanushi*", "simulations*", "mina_v2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests", "models/MINA-V2-MM/src"]
addopts = "-q"
