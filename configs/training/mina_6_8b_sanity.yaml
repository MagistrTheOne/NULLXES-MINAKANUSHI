stage: 0
name: mina_6_8b_sanity_pretrain
architecture: configs/architecture/minakanushi_6_8b.yaml
simulation: configs/simulation/milestone1.yaml
dataset_name: mina_6_8b_curriculum
n_overfit_episodes: 16

seed: 7
steps: 20
batch_size: 1
sequence_length: 12
learning_rate: 0.0001
weight_decay: 0.01
grad_clip: 1.0
log_every: 1
eval_every: 5
checkpoint_every: 10
warmup_steps: 0

precision: bf16
device: cuda
parallelism: fsdp2_zero3
activation_checkpoint: false
shard_max_bytes: 1073741824

lambdas:
  state: 1.0
  temporal: 1.0
  future: 0.5
  uncertainty: 0.3
  causal: 0.2
  memory: 0.4
  action: 0.3
  representation: 0.05
  belief: 0.5
  revision: 1.0

regularizer:
  isotropic_weight: 0.05
  counterfactual_margin: 0.25
