stage: 0
name: stage_a_gpu_train_v01
architecture: configs/architecture/gpu_train_v01.yaml
simulation: configs/simulation/milestone1.yaml
dataset_name: stage0_synthetic
n_overfit_episodes: 16

seed: 7
steps: 200
batch_size: 1
sequence_length: 12
learning_rate: 0.001
weight_decay: 0.0001
grad_clip: 1.0
log_every: 10
eval_every: 50
checkpoint_every: 100

precision: bf16
device: cuda

lambdas:
  state: 1.0
  temporal: 1.0
  future: 0.5
  uncertainty: 0.3
  causal: 0.2
  memory: 0.4
  action: 0.3
  representation: 0.05
  belief: 0.5
  revision: 1.0

regularizer:
  isotropic_weight: 0.05
  counterfactual_margin: 0.25
