stage: 1
name: world_representation
architecture: configs/architecture/cpu_dev.yaml
simulation: configs/simulation/milestone1.yaml

seed: 11
steps: 1000
batch_size: 16
sequence_length: 16
learning_rate: 0.0005
weight_decay: 0.0001
grad_clip: 1.0
log_every: 25
eval_every: 100
checkpoint_every: 200

precision: float32
device: cpu

lambdas:
  state: 1.0
  temporal: 0.4
  future: 0.2
  uncertainty: 0.4
  causal: 0.1
  memory: 0.3
  action: 0.1
  representation: 0.05

regularizer:
  isotropic_weight: 0.05
  counterfactual_margin: 0.25
