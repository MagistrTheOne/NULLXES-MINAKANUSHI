# Stage 2 temporal dynamics — local controlled run profile for RTX 2080 SUPER 8 GB.
#
# Loss contract is UNCHANGED Stage2 (same lambdas/regularizer as
# stage2_temporal.yaml). Aggression comes only from update count (400 steps)
# and a moderate LR (3e-4 with 25-step warmup), not from loss reweighting.
#
# NOTE: trainer unroll is currently single-episode (batch_index=0); the
# batch_size value below does not change VRAM today. Real batching would
# need trainer support. Keep 1 until the 1-step VRAM smoke is measured.
stage: 2
name: temporal_dynamics_local_2080s
architecture: configs/architecture/cpu_dev.yaml
simulation: configs/simulation/milestone1.yaml

seed: 13
steps: 400
batch_size: 1
sequence_length: 24
learning_rate: 0.0003
weight_decay: 0.0001
grad_clip: 1.0
log_every: 5
eval_every: 25
checkpoint_every: 100
warmup_steps: 25

precision: float32
device: cuda
parallelism: none
activation_checkpoint: false

lambdas:
  state: 0.6
  temporal: 1.0
  future: 0.6
  uncertainty: 0.3
  causal: 0.3
  memory: 0.2
  action: 0.4
  representation: 0.05

regularizer:
  isotropic_weight: 0.05
  counterfactual_margin: 0.35
