stage: 0
name: architecture_validation
architecture: configs/architecture/cpu_dev.yaml
simulation: configs/simulation/milestone1.yaml

seed: 7
steps: 200
batch_size: 8
sequence_length: 12
learning_rate: 0.001
weight_decay: 0.0001
grad_clip: 1.0
log_every: 20
eval_every: 50
checkpoint_every: 100

precision: float32
device: cpu

lambdas:
  state: 1.0
  temporal: 1.0
  future: 0.5
  uncertainty: 0.3
  causal: 0.2
  memory: 0.4
  action: 0.3
  representation: 0.05

regularizer:
  isotropic_weight: 0.05
  counterfactual_margin: 0.25
