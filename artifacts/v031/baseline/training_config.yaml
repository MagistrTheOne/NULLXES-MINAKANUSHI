stage: 0
name: mina_6_8b_v03
architecture: configs/architecture/minakanushi_6_8b.yaml
simulation: configs/simulation/milestone1.yaml
dataset_name: "NULLXES MINAKANUSHI Status Core Curriculum v0.3"
dataset_root: dataset/mina_6_8b_v03
dataset_split: train
n_overfit_episodes: 32

seed: 11
steps: 1000
batch_size: 1
sequence_length: 12
learning_rate: 0.0001
weight_decay: 0.01
grad_clip: 1.0
log_every: 10
eval_every: 50
checkpoint_every: 250
warmup_steps: 0

precision: bf16
device: cuda
parallelism: fsdp2_zero3
activation_checkpoint: false
shard_max_bytes: 1073741824

sampler_mode: auto
warm_steps: 16

lambdas:
  state: 1.0
  temporal: 1.0
  future: 0.5
  uncertainty: 0.3
  causal: 0.2
  memory: 0.4
  action: 0.3
  representation: 0.05
  belief: 0.5
  revision: 1.0

regularizer:
  isotropic_weight: 0.05
  counterfactual_margin: 0.25
